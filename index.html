#edf4fa;display:grid;place-items:center;color:var(--blue);font-size:20px}.sect{margin-top:17px}.sectitle{font-weight:900;font-size:14px;margin-bottom:11px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:780px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:right}.table th{background:#f8fafc;color:var(--muted)}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap}.tag.ok{background:#e7f7ef;color:var(--green);border:0}.tag.warn{background:#fff4df;color:var(--amber);border:0}.tag.bad{background:#fdecea;color:var(--red);border:0}.tag.info{background:#eaf2fb;color:var(--blue);border:0}.tag.purple{background:#f0ebff;color:var(--purple);border:0}.field{margin-bottom:12px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;outline:0;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:#91b0ca;box-shadow:0 0 0 3px #edf4fa}.notice{padding:12px 14px;border-radius:12px;border:1px solid #dce8f2;background:#f2f7fb;font-size:11px;line-height:1.8}.notice.okn{background:#edf9f3;border-color:#cbe8d9}.notice.warnn{background:#fff9ec;border-color:#efdfba}.notice.redn{background:#fff2f0;border-color:#f0c9c3}.timeline{display:grid;gap:9px}.event{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.dot{width:8px;height:8px;background:var(--gold);border-radius:50%;margin-top:5px;flex:none}.progress{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:99px}.switch{width:43px;height:24px;border-radius:99px;background:#d6dce4;padding:3px}.switch i{width:18px;height:18px;border-radius:50%;display:block;background:#fff;transition:.2s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(-19px)}.checkrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}.empty{text-align:center;padding:44px;color:var(--muted)}.empty .big{font-size:38px;margin-bottom:7px}.stepper{display:flex;align-items:center;margin-bottom:16px;overflow:auto}.step{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);white-space:nowrap}.step i{width:30px;height:30px;border-radius:50%;background:#e8edf2;display:grid;place-items:center;font-style:normal;font-weight:900}.step.on{color:var(--nav)}.step.on i{background:var(--nav);color:#fff}.line{width:35px;height:1px;background:var(--line);margin:0 7px}.examq{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.examqhead{display:flex;justify-content:space-between;align-items:center}.choice{padding:6px 0;font-size:11px;display:flex;gap:6px}.choice input{width:auto}.scanbox{height:300px;border:2px dashed #a9bacb;border-radius:18px;background:linear-gradient(145deg,#eef4f8,#fafcff);display:grid;place-items:center;position:relative;overflow:hidden}.scanframe{width:73%;height:72%;border:2px solid var(--blue);border-radius:5px;position:relative}.scanframe:before,.scanframe:after{content:"";position:absolute;left:10px;right:10px;height:2px;background:var(--gold);animation:scan 2s infinite}.scanframe:before{top:15%}.scanframe:after{top:60%;animation-delay:1s}@keyframes scan{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(35px)}}.review{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.paper{min-height:380px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;box-shadow:0 8px 25px #0c2a4910}.bubble{width:18px;height:18px;border:2px solid #718096;border-radius:50%;display:inline-block;margin:3px}.bubble.fill{background:#172234}.score{font-size:31px;font-weight:900;color:var(--nav)}.rolebox{border:1px solid var(--line);border-radius:13px;padding:12px}.rolebox h4{margin:0 0 8px}.perm{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:10px}.modalbg{display:none;position:fixed;inset:0;background:#071522a6;z-index:100;padding:15px;align-items:center;justify-content:center}.modal{width:min(880px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:21px;box-shadow:0 40px 100px #0005}.mhead{padding:16px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.mbody{padding:19px}.mfoot{padding:13px 19px;border-top:1px solid var(--line);display:flex;gap:8px}.close{border:0;background:none;font-size:22px}.toast{display:none;position:fixed;bottom:23px;right:23px;background:#172234;color:#fff;border-radius:12px;padding:12px 16px;z-index:200;box-shadow:var(--shadow2);font-size:11px}.mobile{display:none}.fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:1050px){.side{width:230px}.main{margin-right:230px;width:calc(100% - 230px)}.g4{grid-template-columns:repeat(2,1fr)}.review{grid-template-columns:1fr}}
@media(max-width:720px){.side{display:none}.main{margin:0;width:100%}.top{height:67px;padding:0 13px}.search{display:none}.page{padding:17px 13px 84px}.head{display:block}.actions{margin-top:11px}.g2,.g3,.g4{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}.hero h2{font-size:23px}.mobile{position:fixed;display:flex;right:0;left:0;bottom:0;height:67px;background:#fff;border-top:1px solid var(--line);z-index:50;justify-content:space-around}.mobile button{border:0;background:none;font-size:8px;color:var(--muted)}.mobile b{font-size:17px;display:block}}

<body>
<div class="app"><aside class="side"><div class="brand"><div class="mark">م</div><div><b>منظومة المعلم العالمية</b><small>GLOBAL EDUCATION OS</small></div></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><header class="top"><div class="topright"><div class="profile"><div class="av">س</div><div><b>سعود القرشي</b><div style="font-size:9px;color:var(--muted)" id="role"></div></div></div></div><div class="topleft"><input class="search" id="search" placeholder="ابحث في النظام…"><button class="btn" onclick="toast('لا توجد إشعارات جديدة')">🔔</button><button class="btn soft" onclick="roleModal()">تجربة الدور ▾</button></div></header><section class="page fade" id="view"></section></main></div>
<div class="mobile" id="mobile"></div><div class="modalbg" id="modal"><div class="modal"><div class="mhead"><b id="mt"></b><button class="close" onclick="closeM()">×</button></div><div class="mbody" id="mb"></div><div class="mfoot" id="mf"></div></div></div><div class="toast" id="toast"></div>
<script>
const S='global_edu_v3';let route=localStorage.getItem('g_route')||'home',role=localStorage.getItem('g_role')||'teacher';
const D=JSON.parse(localStorage.getItem(S)||'null')||{
 school:'مدارس التميز العالمية',
 students:[['إبراهيم بن عامر أحمد آل رزيع','1157425495','الأول المتوسط / أ'],['عبدالله محمد العتيبي','1157425496','الأول المتوسط / أ'],['سلمان أحمد القحطاني','1157425497','الثاني المتوسط / ب']],
 teachers:['خالد عبدالله','محمد علي','عبدالله أحمد'],
 subjects:['الرياضيات','العلوم','العربية','القرآن الكريم','التفسير'],
 classes:['الأول المتوسط / أ','الثاني المتوسط / ب','الثالث المتوسط / أ'],
 audit:[['22:41','سعود القرشي','اعتماد الجدول','نجاح'],['21:18','خالد عبدالله','حفظ تحضير الحصة','نجاح']],
 exams:[['EX-001','اختبار الرياضيات','16','20','مفتاح الإجابة معتمد']],
 tickets:[['SUP-1042','مشكلة تقنية','مشكلة في الطباعة','قيد المعالجة']],
 schedule:[
  {id:'SL-1',day:'الأحد',period:'1',time:'07:00',teacher:'خالد عبدالله',nationalId:'1022222222',className:'الأول المتوسط / أ',subject:'الرياضيات',status:'اعتمد',approvedAt:'2026-09-07 06:50'},
  {id:'SL-2',day:'الأحد',period:'2',time:'07:45',teacher:'محمد علي',nationalId:'1033333333',className:'الثاني المتوسط / ب',subject:'العلوم',status:'اعتمد',approvedAt:'2026-09-07 06:55'},
  {id:'SL-3',day:'الأحد',period:'3',time:'08:30',teacher:'خالد عبدالله',nationalId:'1022222222',className:'الثالث المتوسط / أ',subject:'العربية',status:'بانتظار',approvedAt:''}
]};
const menus={
 system:[['الرئيسية','home','⌂'],['إدارة المدارس','schools','🏫'],['المستخدمون والأدوار','roles','♙'],['التقويم الدراسي','calendar','□'],['الاشتراكات','subscriptions','◇'],['مركز الميزات','features','🧩'],['الثيمات','themes','🎨'],['الدعم الفني','support','?'],['سجل التدقيق','audit','▤'],['النسخ الاحتياطي','backups','☁️'],['الإعدادات','settings','⚙']],
 school:[['الرئيسية','home','⌂'],['الجدول العام','schedule','▦'],['المعلمون','teachers','♟'],['الطلاب','students','♙'],['الحضور والغياب','attendance','✓'],['المشاركة والسلوك','participation','◎'],['الواجبات','homework','▤'],['الدرجات','grades','▥'],['الإحالات','referrals','↗'],['متابعة ولي الأمر','parent','⌁'],['المساءلات','accountability','!'],['الاجتماعات','meetings','◉'],['التعاميم','circulars','▧'],['التقارير','reports','▤'],['المستخدمون والصلاحيات','roles','♙'],['التقويم','calendar','□'],['المدرسة','school','⌂'],['الاشتراكات','subscriptions','◇'],['الدعم الفني','support','?'],['الإعدادات','settings','⚙']],
 teacher:[['الرئيسية','home','⌂'],['المساءلات','accountability','⚖'],['الجدول','schedule','▦'],['الطلاب','students','♙'],['سجل الحصص','lesson','▤'],['الحضور','attendance','✓'],['المشاركة والسلوك','participation','◎'],['الواجبات','homework','▤'],['الدرجات','grades','▥'],['الإحالات','referrals','↗'],['متابعة ولي الأمر','parent','⌁'],['التصحيح الإلكتروني','correction','🖨️'],['التقارير','reports','▤'],['الإعدادات','settings','⚙']],
 counselor:[['الرئيسية','home','⌂'],['الطلاب','students','♙'],['الحضور','attendance','✓'],['المشاركة والسلوك','participation','◎'],['الإحالات','referrals','↗'],['التقارير','reports','▤'],['الإعدادات','settings','⚙']]
};
function save(){localStorage.setItem(S,JSON.stringify(D));localStorage.setItem('g_route',route);localStorage.setItem('g_role',role)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}
function go(x){
 const allowed=(menus[role]||[]).map(function(v){return v[1]});
 if(allowed.indexOf(x)<0){toast('هذه الوظيفة غير متاحة لهذا الدور');return;}
 route=x; localStorage.setItem('g_route',route); buildNav(); render();
}
function openM(t,b,f=''){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('mf').innerHTML=f;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function roleName(r){return {system:'مدير النظام',school:'مدير المدرسة',teacher:'المعلم',counselor:'المرشد الطلابي'}[r]}

function roleModal(){
 openM('اختيار الحساب والدور',
 `<div class="notice okn">اختر الحساب التجريبي المطلوب. بعد الاختيار يعاد بناء القائمة والصفحة فورًا.</div>
 <div class="grid g2">
  <button class="card pad" onclick="setDemoRole('system')" style="cursor:pointer;text-align:right"><div class="sectitle">مدير المنظومة</div><div class="tiny muted">إدارة المنصة والمدارس والاشتراكات</div></button>
  <button class="card pad" onclick="setDemoRole('school')" style="cursor:pointer;text-align:right"><div class="sectitle">مدير المدرسة</div><div class="tiny muted">إدارة المدرسة والجدول والمعلمين</div></button>
  <button class="card pad" onclick="setDemoRole('teacher')" style="cursor:pointer;text-align:right"><div class="sectitle">المعلم</div><div class="tiny muted">منظومة المعلم المعتمدة</div></button>
  <button class="card pad" onclick="setDemoRole('counselor')" style="cursor:pointer;text-align:right"><div class="sectitle">المرشد الطلابي</div><div class="tiny muted">متابعة الطلاب والإحالات</div></button>
 </div>`,
 `<button class="btn" onclick="closeM()">إلغاء</button>`);
}
function setDemoRole(r){
 if(!menus[r]){toast('الدور غير موجود في النظام');return;}
 role=r;route='home';save();
 closeM();
 bindSafeClicks();
 buildNav();
 render();
 toast('تم الدخول إلى حساب '+roleName(r));
};
/* V20 interaction safety layer: delegated clicks for local-file/WebView environments */
function bindSafeClicks(){
 if(window.__safeClicksBound)return;
 window.__safeClicksBound=true;
 document.addEventListener('click',function(ev){
  var el=ev.target.closest ? ev.target.closest('[data-role-action],[data-nav-action],[data-role-modal]') : null;
  if(!el)return;
  ev.preventDefault();ev.stopPropagation();
  if(el.hasAttribute('data-role-modal')){roleModal();return;}
  if(el.hasAttribute('data-role-action')){setDemoRole(el.getAttribute('data-role-action'));return;}
  if(el.hasAttribute('data-nav-action')){go(el.getAttribute('data-nav-action'));return;}
 });
}
function buildNav(){let a=menus[role]||[];document.getElementById('role').textContent=roleName(role)||role;document.getElementById('nav').innerHTML=a.map(x=>`<button class="${route===x[1]?'active':''}" onclick="go('${x[1]}')"><span class="ni">${x[2]}</span>${x[0]}</button>`).join('');document.getElementById('mobile').innerHTML=a.slice(0,5).map(x=>`<button onclick="go('${x[1]}')"><b>${x[2]}</b>${x[0]}</button>`).join('')}
function H(t,s,a=''){return `<div class="head"><div><div class="crumb">الرئيسية ‹ ${t}</div><h1>${t}</h1><div style="color:var(--muted);font-size:11px">${s||''}</div></div><div class="actions">${a}</div></div>`}
function stat(n,l,i){return `<div class="card stat"><div><div class="statnum">${n}</div><div class="statlabel">${l}</div></div><div class="ico">${i}</div></div>`}
function feature(i,t,d,r){return `<div class="card pad" onclick="go('${r}')" style="cursor:pointer;display:flex;gap:12px;transition:.18s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'"><div class="ico">${i}</div><div><b>${t}</b><div style="font-size:10px;color:var(--muted);line-height:1.7;margin-top:4px">${d}</div></div></div>`}
/* ===== إصلاح V28: تعريف الصفحات المفقودة التي كان استدعاؤها في render() يكسر التطبيق بالكامل ===== */
function _today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function classList(){return D.classes||[];}
function studentsOf(cls){D.students=D.students||[];return D.students.filter(function(s){return !cls||s[2]===cls;});}

/* ---------- الطلاب ---------- */
function pStudents(){
 D.students=D.students||[];
 var rows=D.students.length?D.students.map(function(s,i){return '<tr><td><b>'+esc(s[0])+'</b></td><td class="tiny muted">'+esc(s[1])+'</td><td>'+esc(s[2])+'</td><td><button class="btn" onclick="studentForm('+i+')">تعديل</button> <button class="btn danger" onclick="studentDel('+i+')">حذف</button></td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty">لا يوجد طلاب مسجلون.</div></td></tr>';
 document.getElementById('view').innerHTML=H('الطلاب','بطاقة الطالب: البيانات الأساسية والفصل الدراسي','<button class="btn gold" onclick="studentForm()">＋ طالب</button>')+
  '<div class="grid g4">'+stat(D.students.length,'إجمالي الطلاب','🎓')+stat(classList().length,'الفصول','▦')+stat((D.teachers||[]).length,'المعلمون','👥')+stat((D.subjects||[]).length,'المواد','▤')+'</div>'+
  '<div class="card pad sect"><div class="sectitle">سجل الطلاب</div><div class="tablewrap"><table class="table"><tr><th>الاسم الرباعي</th><th>رقم الهوية</th><th>الفصل</th><th></th></tr>'+rows+'</table></div></div>';

/* ================= نظام توليد الجدول العام الفعلي (School Timetable Generator) ================= */
var SB_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
function q(x){return String(x==null?'':x).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function sbInit(){
 D.sb=D.sb||{};var sb=D.sb;
 sb.teachers=sb.teachers||(D.teachers?D.teachers.slice():[]);
 sb.classes=sb.classes||(D.classes?D.classes.slice():[]);
 sb.subjects=sb.subjects||[{name:'القرآن الكريم',quota:5},{name:'التوحيد',quota:2},{name:'الفقه',quota:2},{name:'الرياضيات',quota:6},{name:'لغتي',quota:8},{name:'العلوم',quota:3},{name:'الدراسات الاجتماعية',quota:2}];
 sb.classSubjects=sb.classSubjects||{};
 sb.classes.forEach(function(c){if(!sb.classSubjects[c])sb.classSubjects[c]=sb.subjects.map(function(s){return s.name;});});
 sb.assign=sb.assign||{};
 sb.periodsPerDay=sb.periodsPerDay||7;
 sb.breakAfter=sb.breakAfter||3;
 sb.breakMin=sb.breakMin||20;
 sb.breaksPerWeek=sb.breaksPerWeek||SB_DAYS.length;
 sb.supervisors=sb.supervisors||[];
 sb.meta=sb.meta||{};
 return sb;
}
function sbQuota(name){var s=(D.sb.subjects||[]).find(function(x){return x.name===name;});return s?(+s.quota||0):0;}
function sbAssignSum(c,s){var a=(D.sb.assign[c]||{})[s]||{};return Object.keys(a).reduce(function(t,k){return t+(+a[k]||0);},0);}
function sbTeacherLoad(name){var sb=D.sb,t=0;sb.classes.forEach(function(c){var cs=sb.classSubjects[c]||[];cs.forEach(function(s){var a=(sb.assign[c]||{})[s]||{};t+=(+a[name]||0);});});return t;}
function sbClassTarget(c){var sb=D.sb;return (sb.classSubjects[c]||[]).reduce(function(t,s){return t+sbQuota(s);},0);}

function sbAllTeachers(on){D.sb.teachers=on?D.teachers.slice():[];save();pSchedule();}

function sbSetMeta(ti,field,v){var n=D.teachers[ti];D.sb.meta[n]=D.sb.meta[n]||{};D.sb.meta[n][field]=v;save();}
function sbAddClass(){var v=document.getElementById('sb-newclass').value.trim();if(!v)return;if(D.sb.classes.indexOf(v)<0){D.sb.classes.push(v);D.sb.classSubjects[v]=D.sb.subjects.map(function(s){return s.name;});}save();pSchedule();}
function sbGenClasses(){var g=document.getElementById('sb-grades').value.split(',').map(function(x){return x.trim();}).filter(Boolean);var secN=+document.getElementById('sb-sections').value||0;var secs=['أ','ب','ج','د','هـ','و'];g.forEach(function(gr){for(var i=0;i<secN;i++){var nm=gr+' / '+secs[i];if(D.sb.classes.indexOf(nm)<0){D.sb.classes.push(nm);D.sb.classSubjects[nm]=D.sb.subjects.map(function(s){return s.name;});}}});save();pSchedule();}
function sbDelClass(ci){var c=D.sb.classes[ci];D.sb.classes.splice(ci,1);delete D.sb.classSubjects[c];delete D.sb.assign[c];save();pSchedule();}
function sbToggleCS(ci,si){var c=D.sb.classes[ci],s=D.sb.subjects[si].name;var arr=D.sb.classSubjects[c]=D.sb.classSubjects[c]||[];var i=arr.indexOf(s);if(i<0)arr.push(s);else arr.splice(i,1);save();pSchedule();}
function sbSetQuota(si,v){D.sb.subjects[si].quota=Math.max(0,+v||0);save();pSchedule();}
function sbAddSubject(){var n=document.getElementById('sb-subjname').value.trim();var qv=+document.getElementById('sb-subjquota').value||1;if(!n)return;if(!D.sb.subjects.some(function(s){return s.name===n;})){D.sb.subjects.push({name:n,quota:qv});}save();pSchedule();}
function sbDelSubject(si){var nm=D.sb.subjects[si].name;D.sb.subjects.splice(si,1);Object.keys(D.sb.classSubjects).forEach(function(c){D.sb.classSubjects[c]=D.sb.classSubjects[c].filter(function(s){return s!==nm;});});save();pSchedule();}
function sbSetAssign(ci,si,ti,v){var c=D.sb.classes[ci],s=D.sb.subjects[si].name,t=D.sb.teachers[ti];D.sb.assign[c]=D.sb.assign[c]||{};D.sb.assign[c][s]=D.sb.assign[c][s]||{};var n=Math.max(0,+v||0);if(n===0)delete D.sb.assign[c][s][t];else D.sb.assign[c][s][t]=n;save();pSchedule();}
function sbSetBreak(){D.sb.breaksPerWeek=+document.getElementById('sb-bpw').value||0;D.sb.breakAfter=+document.getElementById('sb-bafter').value||0;D.sb.breakMin=+document.getElementById('sb-bmin').value||0;D.sb.periodsPerDay=Math.max(1,+document.getElementById('sb-ppd').value||7);save();pSchedule();}
function sbAllSup(on){D.sb.supervisors=on?D.sb.teachers.slice():[];save();pSchedule();}
function sbToggleSup(ti){var n=D.sb.teachers[ti],a=D.sb.supervisors,i=a.indexOf(n);if(i<0)a.push(n);else a.splice(i,1);save();pSchedule();}

/* ---------- generator ---------- */
function countSubjInDay(grid,d,subject){var c=0,ppd=D.sb.periodsPerDay;for(var p=0;p<ppd;p++){if(grid[d][p]&&grid[d][p].subject===subject)c++;}return c;}
function generateSchedule(){
 var sb=sbInit(),errors=[],warnings=[];
 if(!sb.classes.length)errors.push('لا توجد فصول. أضِف الفصول أولًا.');
 if(!sb.teachers.length)errors.push('لم يتم اختيار أي معلم.');
 var DAYS=SB_DAYS.length,PPD=sb.periodsPerDay,cap=DAYS*PPD;
 sb.classes.forEach(function(c){
  var target=sbClassTarget(c);
  if(target>cap)errors.push('حصص الفصل «'+c+'» ('+target+') تتجاوز المتاح أسبوعيًا ('+cap+').');
  (sb.classSubjects[c]||[]).forEach(function(s){
   var quota=sbQuota(s),sum=sbAssignSum(c,s);
   if(sum>quota)errors.push('عدد الحصص المسندة لمادة «'+s+'» في «'+c+'» يتجاوز النصاب المحدد ('+sum+'/'+quota+').');
   else if(sum<quota)warnings.push('لم يكتمل توزيع حصص «'+s+'» للفصل «'+c+'» ('+sum+'/'+quota+').');
  });
 });
 // نصاب المعلم لا يتجاوز الحصص المتاحة أسبوعيًا
 sb.teachers.forEach(function(t){var L=sbTeacherLoad(t);if(L>cap)errors.push('عبء المعلم «'+t+'» ('+L+' حصة) يتجاوز المتاح أسبوعيًا ('+cap+').');});
 if(errors.length){D.sbOut={error:true,errors:errors,warnings:warnings};save();pSchedule();toast('تعذّر التوزيع: عالج الأخطاء المعلّمة بالأحمر');return;}

 var grids={},tBusy={},units=[];
 sb.classes.forEach(function(c){
  var g=[];for(var d=0;d<DAYS;d++){g.push([]);for(var p=0;p<PPD;p++)g[d].push(null);}
  grids[c]=g;
  (sb.classSubjects[c]||[]).forEach(function(s){
   var a=(sb.assign[c]||{})[s]||{};
   Object.keys(a).forEach(function(tn){for(var k=0;k<(+a[tn]||0);k++)units.push({cls:c,subject:s,teacher:tn});});
  });
 });
 // ترتيب حسب ندرة المعلم (الأعلى عبئًا أولًا) لتقليل الانسداد
 var loadOf={};sb.teachers.forEach(function(t){loadOf[t]=sbTeacherLoad(t);});
 units.sort(function(a,b){return (loadOf[b.teacher]||0)-(loadOf[a.teacher]||0);});

 function free(u,d,p){return !grids[u.cls][d][p] && !(u.teacher&&tBusy[d+'-'+p+'-'+u.teacher]);}
 function put(u,d,p){grids[u.cls][d][p]={subject:u.subject,teacher:u.teacher};if(u.teacher)tBusy[d+'-'+p+'-'+u.teacher]=true;}
 function clear(u,d,p){grids[u.cls][d][p]=null;if(u.teacher)delete tBusy[d+'-'+p+'-'+u.teacher];}
 function sameSubjInDay(c,d,subject){var n=0;for(var p=0;p<PPD;p++){var x=grids[c][d][p];if(x&&x.subject===subject)n++;}return n;}

 var unplaced=[];
 units.forEach(function(u){
  var best=null,bestScore=1e9;
  for(var d=0;d<DAYS;d++)for(var p=0;p<PPD;p++){
   if(!free(u,d,p))continue;
   var score=sameSubjInDay(u.cls,d,u.subject)*100+d; // تفادي تكرار المادة في اليوم
   if(score<bestScore){bestScore=score;best=[d,p];}
  }
  if(best)put(u,best[0],best[1]);else unplaced.push(u);
 });

 // مرحلة الإصلاح: إعادة توطين الحصة المعرقِلة لإفساح مكان للحصص المتبقية
 var still=[];
 unplaced.forEach(function(u){
  var done=false;
  for(var d=0;d<DAYS&&!done;d++)for(var p=0;p<PPD&&!done;p++){
   if(grids[u.cls][d][p])continue;              // خانة الفصل مشغولة
   if(!u.teacher||!tBusy[d+'-'+p+'-'+u.teacher])continue; // المعلم متفرغ أصلًا (كان يجب وضعها)
   // ابحث عن الفصل الآخر الذي يشغل هذا المعلم في هذا التوقيت وانقله
   for(var ci=0;ci<sb.classes.length&&!done;ci++){
    var oc=sb.classes[ci];var cell=grids[oc][d][p];
    if(!cell||cell.teacher!==u.teacher)continue;
    var moved={cls:oc,subject:cell.subject,teacher:cell.teacher};
    clear(moved,d,p);
    for(var d2=0;d2<DAYS&&!done;d2++)for(var p2=0;p2<PPD&&!done;p2++){
     if(d2===d&&p2===p)continue; // لا تُعِدها إلى الخانة نفسها
     if(free(moved,d2,p2)){put(moved,d2,p2);put(u,d,p);done=true;}
    }
    if(!done)put(moved,d,p); // تعذّر النقل: أعِدها مكانها
   }
  }
  if(!done)still.push(u);
 });

 var out={classes:grids,unplaced:still,warnings:warnings,generatedAt:(typeof scheduleNow==='function'?scheduleNow():_today()),conflicts:0};
 var sup={};if(sb.supervisors.length){SB_DAYS.forEach(function(dn,i){sup[dn]=sb.supervisors[i%sb.supervisors.length];});}
 out.supervision=sup;
 var seen={};sb.classes.forEach(function(c){grids[c].forEach(function(row,d){row.forEach(function(cell,p){if(cell&&cell.teacher){var k=d+'-'+p+'-'+cell.teacher;if(seen[k])out.conflicts++;seen[k]=true;}});});});
 if(still.length)out.warnings=out.warnings.concat(['تعذّر إسناد '+still.length+' حصة ضمن الأيام والحصص المتاحة؛ راجع النصاب أو زد عدد الحصص اليومية.']);
 D.sbOut=out;D.audit&&D.audit.unshift([out.generatedAt,'مدير المدرسة','توزيع الجدول العام','نجاح']);save();
 window.sbTab='result';pSchedule();toast('تم توليد الجدول العام'+(out.warnings.length?' مع تنبيهات':''));
}

/* 3+4) المواد والنصاب */
function sbSecSubjects(){
 var sb=D.sb;
 var rows=sb.subjects.map(function(s,i){return '<tr><td><b>'+esc(s.name)+'</b></td><td><input type="number" min="0" max="20" value="'+(+s.quota||0)+'" style="width:90px;text-align:center" onchange="sbSetQuota('+i+',this.value)"></td><td><button class="btn danger" onclick="sbDelSubject('+i+')">حذف</button></td></tr>';}).join('')||'<tr><td colspan="3"><div class="empty">لا توجد مواد.</div></td></tr>';
 var matrix=sb.classes.length?'<div class="tablewrap" style="margin-top:12px"><table class="table"><tr><th>الفصل</th>'+sb.subjects.map(function(s){return '<th>'+esc(s.name)+'</th>';}).join('')+'<th>المجموع</th></tr>'+
  sb.classes.map(function(c,ci){return '<tr><td><b>'+esc(c)+'</b></td>'+sb.subjects.map(function(s,si){var on=(sb.classSubjects[c]||[]).indexOf(s.name)>-1;return '<td style="text-align:center"><input type="checkbox" '+(on?'checked':'')+' onclick="sbToggleCS('+ci+','+si+')"></td>';}).join('')+'<td><span class="tag info">'+sbClassTarget(c)+'</span></td></tr>';}).join('')+'</table></div>':'<div class="empty">أنشئ الفصول أولًا.</div>';
 return '<div class="card pad sect">'+sbStep(3,'مواد كل فصل ونصاب كل مادة','النصاب = عدد حصص المادة أسبوعيًا، وحدّد أي المواد تُدرَّس لكل فصل')+

  '<div class="grid g3 sect"><div class="field"><label>مادة جديدة</label><input id="sb-subjname" placeholder="اسم المادة"></div><div class="field"><label>النصاب</label><input id="sb-subjquota" type="number" min="1" value="2"></div><div class="field"><label>&nbsp;</label><button class="btn" style="width:100%" onclick="sbAddSubject()">＋ إضافة</button></div></div></div>'+
  '<div>'+matrix+'</div></div></div>';
}

/* 5) توزيع المادة على المعلمين */
function sbSecAssign(){
 var sb=D.sb;
 if(!sb.classes.length||!sb.teachers.length)return '<div class="card pad sect">'+sbStep(4,'توزيع المواد على المعلمين','')+'<div class="empty">اختر المعلمين وأنشئ الفصول أولًا.</div></div>';
 var body=sb.classes.map(function(c,ci){
  var subs=(sb.classSubjects[c]||[]);
  if(!subs.length)return '';
  return '<div class="card pad" style="margin-bottom:12px"><div class="sectitle">'+esc(c)+'</div><div class="tablewrap"><table class="table"><tr><th>المادة</th><th>النصاب</th>'+sb.teachers.map(function(t){return '<th>'+esc(t)+'</th>';}).join('')+'<th>المسند</th></tr>'+
   subs.map(function(sn){
    var si=sb.subjects.findIndex(function(x){return x.name===sn;});if(si<0)return '';
    var quota=sbQuota(sn),sum=sbAssignSum(c,sn);
    var tds=sb.teachers.map(function(t,ti){var v=((sb.assign[c]||{})[sn]||{})[t]||'';return '<td style="text-align:center"><input type="number" min="0" max="'+quota+'" value="'+v+'" style="width:64px;text-align:center" onchange="sbSetAssign('+ci+','+si+','+ti+',this.value)"></td>';}).join('');
    var tag=sum>quota?'bad':(sum===quota?'ok':'warn');
    return '<tr><td><b>'+esc(sn)+'</b></td><td><span class="tag info">'+quota+'</span></td>'+tds+'<td><span class="tag '+tag+'">'+sum+'/'+quota+'</span></td></tr>';
   }).join('')+'</table></div></div>';
 }).join('');
 return '<div class="card pad sect">'+sbStep(4,'توزيع المادة بين أكثر من معلم','لا يسمح النظام بتجاوز مجموع الإسناد لنصاب المادة')+body+'</div>';
}

/* الفحص قبل الاعتماد */
function sbValidate(){
 var sb=D.sb,errs=[],warns=[],cap=SB_DAYS.length*sb.periodsPerDay;
 if(!sb.teachers.length)errs.push('لم يتم اختيار أي معلم.');
 if(!sb.classes.length)errs.push('لا توجد فصول.');
 sb.classes.forEach(function(c){
  var target=sbClassTarget(c);
  if(target>cap)errs.push('حصص الفصل «'+c+'» ('+target+') تتجاوز المتاح أسبوعيًا ('+cap+').');
  (sb.classSubjects[c]||[]).forEach(function(s){
   var quota=sbQuota(s),sum=sbAssignSum(c,s);
   if(sum>quota)errs.push('عدد الحصص المسندة لمادة «'+s+'» في «'+c+'» يتجاوز النصاب المحدد ('+sum+'/'+quota+').');
   else if(sum<quota)warns.push('لم يكتمل توزيع حصص «'+s+'» للفصل «'+c+'» ('+sum+'/'+quota+').');
  });
 });
 return {errs:errs,warns:warns};
}
function sbSecCheck(){
 var v=sbValidate();
 var list=function(a,cls){return a.length?a.map(function(x){return '<div class="notice '+cls+'" style="margin-bottom:6px">'+esc(x)+'</div>';}).join(''):'';};
 return '<div class="card pad sect"><div class="sectitle">فحص ما قبل التوزيع</div>'+
  '<div class="checkrow"><span>تجاوز النصاب (زيادة الحصص)</span><span class="tag '+(v.errs.length?'bad':'ok')+'">'+(v.errs.length?'يوجد '+v.errs.length:'سليم')+'</span></div>'+
  '<div class="checkrow"><span>نقص الحصص عن النصاب</span><span class="tag '+(v.warns.length?'warn':'ok')+'">'+(v.warns.length?'يوجد '+v.warns.length:'سليم')+'</span></div>'+
  '<div style="margin-top:10px">'+list(v.errs,'redn')+list(v.warns,'')+'</div>'+
  '<button class="btn primary" style="width:100%;margin-top:12px;font-size:15px;padding:12px" onclick="generateSchedule()">🟦 توزيع الجدول</button></div>';
}

/* عرض الجدول الناتج */
function sbGridTable(c){
 var sb=D.sb,out=D.sbOut;if(!out||!out.classes||!out.classes[c])return '';
 var g=out.classes[c];
 var hdr='<tr><th>اليوم</th>';
 for(var p=0;p<sb.periodsPerDay;p++){hdr+='<th>الحصة '+(p+1)+'</th>';if(p+1===sb.breakAfter&&sb.breakMin)hdr+='<th style="background:var(--gold);color:#fff">فسحة '+sb.breakMin+'د</th>';}
 hdr+='</tr>';
 var body=SB_DAYS.map(function(dn,d){
  var tds='';
  for(var p=0;p<sb.periodsPerDay;p++){
   var cell=g[d][p];
   tds+='<td>'+(cell?'<b>'+esc(cell.subject)+'</b><div class="tiny muted">'+esc(cell.teacher||'—')+'</div>':'<span class="tiny muted">—</span>')+'</td>';
   if(p+1===sb.breakAfter&&sb.breakMin)tds+='<td style="background:#faf6ec" class="tiny muted">فسحة</td>';
  }
  return '<tr><td><b>'+dn+'</b></td>'+tds+'</tr>';
 }).join('');
 return '<div class="card pad sect"><div class="sectitle">'+esc(c)+'</div>'+(out.supervision?'':'')+'<div class="tablewrap"><table class="table">'+hdr+body+'</table></div></div>';
}
function sbSecOutput(){
 var out=D.sbOut;if(!out||out.error)return '';
 var sup=out.supervision||{};

/* جداول المعلمين المولّدة تلقائيًا */
function sbTeacherGrid(t){
 var sb=D.sb,out=D.sbOut;if(!out||!out.classes)return null;
 var g=[];for(var d=0;d<SB_DAYS.length;d++){g.push([]);for(var p=0;p<sb.periodsPerDay;p++)g[d].push(null);}
 Object.keys(out.classes).forEach(function(c){out.classes[c].forEach(function(row,d){row.forEach(function(cell,p){if(cell&&cell.teacher===t)g[d][p]={subject:cell.subject,cls:c};});});});
 return g;
}
function sbTeacherBoards(){
 var sb=D.sb,out=D.sbOut;
 if(!out||out.error||!out.classes)return '<div class="card pad sect"><div class="empty">ولّد الجدول أولًا لتظهر جداول المعلمين.</div></div>';
 return '<div class="sect">'+sb.teachers.map(function(t){
  var g=sbTeacherGrid(t),n=0;
  var hdr='<tr><th>اليوم</th>';for(var p=0;p<sb.periodsPerDay;p++)hdr+='<th>'+(p+1)+'</th>';hdr+='</tr>';
  var body=SB_DAYS.map(function(dn,d){var tds='';for(var p=0;p<sb.periodsPerDay;p++){var c=g[d][p];if(c)n++;tds+='<td>'+(c?'<b>'+esc(c.subject)+'</b><div class="tiny muted">'+esc(c.cls)+'</div>':'<span class="tiny muted">—</span>')+'</td>';}return '<tr><td><b>'+dn+'</b></td>'+tds+'</tr>';}).join('');
  var m=sb.meta[t]||{};
  return '<div class="card pad" style="margin-bottom:12px"><div class="sectitle">'+esc(t)+' <span class="tag ok">'+n+' حصة</span></div><div class="tiny muted">هوية: '+esc(m.nid||'—')+' · تخصص: '+esc(m.spec||'—')+'</div><div class="tablewrap" style="margin-top:8px"><table class="table">'+hdr+body+'</table></div></div>';
 }).join('')+'</div>';
}
function pTeacherSchedule(){
 sbInit();var me=D.sb.teachers[0]||'—';var out=D.sbOut;
 var content=(out&&!out.error&&out.classes)?(function(){var g=sbTeacherGrid(me);var sb=D.sb;
  var hdr='<tr><th>اليوم</th>';for(var p=0;p<sb.periodsPerDay;p++)hdr+='<th>الحصة '+(p+1)+'</th>';hdr+='</tr>';
  var body=SB_DAYS.map(function(dn,d){var tds='';for(var p=0;p<sb.periodsPerDay;p++){var c=g[d][p];tds+='<td>'+(c?'<b>'+esc(c.subject)+'</b><div class="tiny muted">'+esc(c.cls)+'</div>':'<span class="tiny muted">—</span>')+'</td>';}return '<tr><td><b>'+dn+'</b></td>'+tds+'</tr>';}).join('');
  return '<div class="card pad sect"><div class="sectitle">جدولي الأسبوعي</div><div class="tablewrap"><table class="table">'+hdr+body+'</table></div></div>';})():'<div class="card pad sect"><div class="empty">لم يعتمد مدير المدرسة الجدول بعد.</div></div>';
 document.getElementById('view').innerHTML=H('الجدول','جدولك المولّد من الجدول العام للمدرسة','<button class="btn" onclick="sbPrint()">⇩ طباعة</button>')+content;
}

/* ================= المساءلات الإلكترونية — دورة كاملة ================= */
var ACC_REASONS=['غياب','تأخر','غياب عن حصة','أخرى'];
var ACC_STATUS={open:['بانتظار تبرير المعلم','warn'],responded:['بانتظار مراجعة المدير','info'],approved:['اعتُمد الإجراء','ok'],rejected:['رُفضت المساءلة','ok'],escalated:['استُكمل الإجراء','bad']};
function accInit(){D.acc=D.acc||[];D.accSeq=D.accSeq||0;D.currentTeacher=D.currentTeacher||(D.teachers&&D.teachers[0])||'';return D.acc;}
function accSerial(){D.accSeq=(D.accSeq||0)+1;return 'M-'+new Date().getFullYear()+'-'+String(D.accSeq).padStart(4,'0');}
function hijri(dt){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).format(dt||new Date()).replace(/\u200f/g,'');}catch(e){return '—';}}
function greg(dt){dt=dt||new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function clock(dt){dt=dt||new Date();return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');}
function accTeacherMeta(name){var m=(D.sb&&D.sb.meta&&D.sb.meta[name])||{};return {nid:m.nid||'—',spec:m.spec||'—'};}
function accOpenFor(name){accInit();return D.acc.filter(function(a){return a.teacher===name&&a.status==='open';});}
function accFind(id){accInit();return D.acc.find(function(a){return a.id===id;});}

/* ---------- نص الخطاب ---------- */
function accLetter(a){
 return '<div class="notice">السلام عليكم ورحمة الله وبركاته<br>تحية طيبة، وبعد:</div>'+
  '<div class="grid g2 sect"><div class="checkrow"><span>اسم المعلم</span><b>'+esc(a.teacher)+'</b></div>'+
  '<div class="checkrow"><span>رقم الهوية</span><b>'+esc(a.nid)+'</b></div>'+
  '<div class="checkrow"><span>التخصص</span><b>'+esc(a.spec||'—')+'</b></div>'+
  '<div class="checkrow"><span>الرقم الإلكتروني</span><b>'+esc(a.id)+'</b></div>'+
  '<div class="checkrow"><span>التاريخ الهجري</span><b>'+esc(a.hijri)+'</b></div>'+
  '<div class="checkrow"><span>التاريخ الميلادي</span><b>'+esc(a.greg)+'</b></div>'+
  '<div class="checkrow"><span>الوقت</span><b>'+esc(a.time)+'</b></div></div>'+
  '<div class="sectitle">سبب المساءلة</div><div class="notice redn">'+esc(a.reasonText)+'</div>'+
  (a.details?'<div class="sect"><div class="sectitle">تفاصيل الواقعة</div><p>'+esc(a.details)+'</p></div>':'');
}
function accReasonText(reason,other,dateStr){
 var base={'غياب':'غياب المعلم عن العمل بتاريخ '+dateStr,'تأخر':'تأخر المعلم عن الدوام الرسمي بتاريخ '+dateStr,'غياب عن حصة':'غياب المعلم عن حصته المقررة بتاريخ '+dateStr};
 return reason==='أخرى'?(other||'أخرى'):base[reason];
}

function accFillMeta(){var n=document.getElementById('ac-t').value;document.getElementById('ac-nid').value=accTeacherMeta(n).nid;}
function accSave(){
 accInit();
 var t=document.getElementById('ac-t').value,r=document.getElementById('ac-r').value;
 var other=(document.getElementById('ac-other')||{}).value||'';
 if(r==='أخرى'&&!other.trim()){toast('اكتب سبب المساءلة');return;}
 var dt=document.getElementById('ac-date').value||greg();
 var meta=accTeacherMeta(t);
 var a={id:accSerial(),teacher:t,nid:meta.nid,spec:meta.spec,reason:r,reasonOther:other.trim(),
   reasonText:accReasonText(r,other.trim(),dt),details:document.getElementById('ac-det').value.trim(),
   greg:dt,hijri:hijri(new Date(dt)),time:document.getElementById('ac-time').value||clock(),
   createdAt:greg()+' '+clock(),status:'open',reply:'',replyAt:'',files:[],decision:'',decisionAt:'',decisionNote:''};
 D.acc.unshift(a);
 D.audit&&D.audit.unshift([greg(),'مدير المدرسة','إنشاء مساءلة '+a.id+' على '+t,'نجاح']);
 save();closeM();pAccountability();toast('تم إرسال المساءلة '+a.id+' إلى حساب المعلم');
}

function scheduleConflict(candidate,ignoreId){

function saSave(){localStorage.setItem(SAKEY,JSON.stringify(SA))}
function saId(p){return p+Date.now()+Math.floor(Math.random()*10000)}
function saEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function saAudit(a,s){SA.audit.unshift({action:a,subject:s,time:new Date().toLocaleString("ar-SA")});saSave()}
function saNotify(m){if(typeof toast==="function")toast(m);else{var t=document.getElementById("saProToast");if(t){t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},1800)}else alert(m)}}
function saOpen(title,body,ok){
 var o=document.getElementById("saProOverlay");
 document.getElementById("saProTitle").textContent=title;
 document.getElementById("saProBody").innerHTML=body;
 document.getElementById("saProFoot").innerHTML='<button class="saProBtn alt" onclick="saClose()">إلغاء</button><button class="saProBtn" onclick="'+ok+'">حفظ وتنفيذ</button>';
 o.classList.add("show");
}
function saClose(){document.getElementById("saProOverlay").classList.remove("show")}
function saField(label,id,type,value){return '<div class="saProField"><label>'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+saEsc(value||"")+'"></div>'}
function saSelect(label,id,arr,value){var h='<div class="saProField"><label>'+label+'</label><select id="'+id+'">';arr.forEach(function(x){h+='<option '+(x===value?"selected":"")+'>'+saEsc(x)+'</option>'});return h+"</select></div>"}
function saPage(title,sub,body,actions){
 var v=document.getElementById("view");if(!v)return;
 v.innerHTML='<div class="page-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div><div class="ph-actions">'+(actions||"")+'</div></div>'+body;
 window.scrollTo({top:0,behavior:"smooth"});
}
function saTable(head,rows){
 return '<div class="saProCard" style="overflow:auto"><table class="saProTable"><tr>'+head.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr>"+rows+"</table></div>"
}

window.saClose=saClose;

window.saAdmin=function(route){
 saLoad();
 if(route==="schools")return saSchools();
 if(route==="users")return saUsers();
 if(route==="subscriptions")return saPlans();
 if(route==="features")return saFeatures();
 if(route==="themes")return saThemes();
 if(route==="calendar")return saCalendar();
 if(route==="support")return saSupport();
 if(route==="audit")return saAuditPage();
 if(route==="backups")return saBackups();
 if(route==="home")return saHome();
 return saHome();
};

function saHome(){
 var cards=[
 ["schools","🏫","المدارس","إدارة المدارس"],
 ["users","👥","المستخدمون والصلاحيات","الحسابات والأدوار"],
 ["subscriptions","💳","الاشتراكات","الخطط والاستحقاقات"],
 ["features","🧩","الميزات","مركز خصائص المنصة"],
 ["calendar","📅","التقويم الدراسي","الإجازات والأحداث"],
 ["themes","🎨","الثيمات","المناسبات والمظهر"],
 ["support","🎫","الدعم الفني","التذاكر والإرفاقات"],
 ["audit","🛡️","سجل التدقيق","العمليات الحساسة"],
 ["backups","💾","النسخ الاحتياطي","تصدير واستعادة نموذجية"]
 ];
 var html='<div class="grid">';
 cards.forEach(function(c){html+='<div class="col-4"><div class="saProCard" style="cursor:pointer" onclick="saAdmin(\''+c[0]+'\')"><div style="font-size:25px">'+c[1]+'</div><h3>'+c[2]+'</h3><p style="color:#697386">'+c[3]+'</p></div></div>'});
 html+='</div>';
 saPage("مدير المنظومة","مركز تحكم الوظائف العالمية",html);
}
function saSchools(){
 var rows=SA.schools.map(function(s){return'<tr><td>'+saEsc(s.name)+'</td><td>'+saEsc(s.city)+'</td><td><span class="saProBadge">'+s.status+'</span></td><td><button class="saProBtn alt" onclick="saEditSchool(\''+s.id+'\')">فتح</button> <button class="saProBtn danger" onclick="saDeleteSchool(\''+s.id+'\')">حذف</button></td></tr>'}).join("");
 saPage("المدارس","إنشاء وإدارة المدارس",saTable(["المدرسة","المدينة","الحالة","الإجراء"],rows),'<button class="saProBtn" onclick="saAddSchool()">＋ مدرسة</button>');
}
window.saAddSchool=function(){saOpen("إضافة مدرسة",saField("اسم المدرسة *","sf1")+saField("المدينة","sf2"),"saSaveSchool()")}
window.saSaveSchool=function(){var n=document.getElementById("sf1").value.trim();if(!n)return saNotify("اسم المدرسة مطلوب");SA.schools.push({id:saId("S"),name:n,city:document.getElementById("sf2").value,status:"نشطة"});saSave();saAudit("إضافة مدرسة",n);saClose();saSchools();saNotify("تمت إضافة المدرسة")}
window.saEditSchool=function(id){var s=SA.schools.find(function(x){return x.id===id});saOpen("تعديل المدرسة",saField("الاسم","sf1","text",s.name)+saField("المدينة","sf2","text",s.city),"saUpdateSchool('"+id+"')")}
window.saUpdateSchool=function(id){var s=SA.schools.find(function(x){return x.id===id});s.name=document.getElementById("sf1").value.trim()||s.name;s.city=document.getElementById("sf2").value;saSave();saAudit("تعديل مدرسة",s.name);saClose();saSchools();saNotify("تم التحديث")}
window.saDeleteSchool=function(id){var s=SA.schools.find(function(x){return x.id===id});if(!confirm("حذف المدرسة؟"))return;SA.schools=SA.schools.filter(function(x){return x.id!==id});saSave();saAudit("حذف مدرسة",s.name);saSchools();saNotify("تم حذف المدرسة")}

function saUsers(){
 var rows=SA.users.map(function(u){return'<tr><td>'+saEsc(u.name)+'</td><td>'+saEsc(u.email)+'</td><td>'+saEsc(u.role)+'</td><td>'+saEsc(u.status)+'</td><td><button class="saProBtn alt" onclick="saEditUser(\''+u.id+'\')">إدارة</button></td></tr>'}).join("");
 saPage("المستخدمون والصلاحيات","حسابات مدير المنظومة والأدوار الأساسية",saTable(["المستخدم","البريد","الدور","الحالة",""],rows),'<button class="saProBtn" onclick="saAddUser()">＋ مستخدم</button>');
}
window.saAddUser=function(){saOpen("إنشاء مستخدم",saField("الاسم *","uf1")+saField("البريد الإلكتروني *","uf2","email")+saSelect("الدور","uf3",["مدير مدرسة","معلم","موظف"]),"saSaveUser()")}
window.saSaveUser=function(){var n=document.getElementById("uf1").value.trim(),e=document.getElementById("uf2").value.trim();if(!n||!e)return saNotify("الاسم والبريد مطلوبان");SA.users.push({id:saId("U"),name:n,email:e,role:document.getElementById("uf3").value,status:"نشط"});saSave();saAudit("إنشاء مستخدم",e);saClose();saUsers();saNotify("تم إنشاء المستخدم")}
window.saEditUser=function(id){var u=SA.users.find(function(x){return x.id===id});saOpen("إدارة المستخدم",saField("الاسم","uf1","text",u.name)+saSelect("الدور","uf2",["مدير مدرسة","معلم","موظف"],u.role)+saSelect("الحالة","uf3",["نشط","موقوف"],u.status),"saUpdateUser('"+id+"')")}
window.saUpdateUser=function(id){var u=SA.users.find(function(x){return x.id===id});u.name=document.getElementById("uf1").value.trim()||u.name;u.role=document.getElementById("uf2").value;u.status=document.getElementById("uf3").value;saSave();saAudit("تعديل مستخدم",u.email);saClose();saUsers();saNotify("تم تحديث المستخدم")}

function saPlans(){
 var cards=SA.plans.map(function(p){return'<div class="col-4"><div class="saProCard"><div style="font-size:24px">💳</div><h3>'+saEsc(p.name)+'</h3><p><b>'+p.price+'</b> ريال / '+saEsc(p.period)+'</p><span class="saProBadge">'+(p.active?"مفعلة":"موقوفة")+'</span><div style="margin-top:12px"><button class="saProBtn alt" onclick="saTogglePlan(\''+p.id+'\')">'+(p.active?"إيقاف":"تفعيل")+'</button></div></div></div>'}).join("");
 saPage("الاشتراكات","الخطط التي تتحكم في استحقاقات المنصة",'<div class="grid">'+cards+'</div>','<button class="saProBtn" onclick="saAddPlan()">＋ خطة اشتراك</button>');
}
window.saAddPlan=function(){saOpen("إنشاء خطة اشتراك",saField("اسم الخطة *","pf1")+saField("السعر بالريال","pf2","number")+saSelect("الدورة","pf3",["شهري","سنوي"]),"saSavePlan()")}
window.saSavePlan=function(){var n=document.getElementById("pf1").value.trim();if(!n)return saNotify("اسم الخطة مطلوب");SA.plans.push({id:saId("P"),name:n,price:Number(document.getElementById("pf2").value)||0,period:document.getElementById("pf3").value,active:true});saSave();saAudit("إنشاء خطة اشتراك",n);saClose();saPlans();saNotify("تم إنشاء الخطة")}
window.saTogglePlan=function(id){var p=SA.plans.find(function(x){return x.id===id});p.active=!p.active;saSave();saAudit(p.active?"تفعيل خطة":"إيقاف خطة",p.name);saPlans();saNotify("تم تحديث الخطة")}

function saFeatures(){
 var cards=SA.features.map(function(f){return'<div class="col-4"><div class="saProCard"><div style="font-size:24px">🧩</div><h3>'+saEsc(f.name)+'</h3><p><span class="saProBadge">'+(f.active?"متاحة":"موقوفة")+'</span></p><button class="saProBtn alt" onclick="saToggleFeature(\''+f.id+'\')">'+(f.active?"إيقاف":"تفعيل")+'</button></div></div>'}).join("");
 saPage("الميزات","مركز خصائص المنصة وإتاحتها",'<div class="grid">'+cards+'</div>','<button class="saProBtn" onclick="saAddFeature()">＋ ميزة</button>');
}
window.saAddFeature=function(){saOpen("إضافة ميزة",saField("اسم الميزة *","ff1")+saField("وصف","ff2"),"saSaveFeature()")}
window.saSaveFeature=function(){var n=document.getElementById("ff1").value.trim();if(!n)return saNotify("اسم الميزة مطلوب");SA.features.push({id:saId("F"),name:n,description:document.getElementById("ff2").value,active:true});saSave();saAudit("إضافة ميزة",n);saClose();saFeatures();saNotify("تمت إضافة الميزة")}
window.saToggleFeature=function(id){var f=SA.features.find(function(x){return x.id===id});f.active=!f.active;saSave();saAudit(f.active?"تفعيل ميزة":"إيقاف ميزة",f.name);saFeatures();saNotify("تم تحديث الميزة")}

function saCalendar(){
 var rows=SA.calendar.map(function(c){return'<tr><td>'+saEsc(c.title)+'</td><td>'+saEsc(c.type)+'</td><td>'+saEsc(c.from)+'</td><td>'+saEsc(c.to)+'</td><td><button class="saProBtn danger" onclick="saDeleteCalendar(\''+c.id+'\')">حذف</button></td></tr>'}).join("");
 saPage("التقويم الدراسي","الأحداث والإجازات",saTable(["الحدث","النوع","من","إلى",""],rows),'<button class="saProBtn" onclick="saAddCalendar()">＋ حدث</button>');
}
window.saAddCalendar=function(){saOpen("إضافة حدث",saField("اسم الحدث *","cf1")+saSelect("النوع","cf2",["إجازة","دراسي","اختبارات","مناسبة"])+saField("من","cf3","date")+saField("إلى","cf4","date"),"saSaveCalendar()")}
window.saSaveCalendar=function(){var n=document.getElementById("cf1").value.trim();if(!n)return saNotify("اسم الحدث مطلوب");SA.calendar.push({id:saId("C"),title:n,type:document.getElementById("cf2").value,from:document.getElementById("cf3").value,to:document.getElementById("cf4").value});saSave();saAudit("إضافة حدث تقويم",n);saClose();saCalendar();saNotify("تم حفظ الحدث")}
window.saDeleteCalendar=function(id){var c=SA.calendar.find(function(x){return x.id===id});if(!confirm("حذف الحدث؟"))return;SA.calendar=SA.calendar.filter(function(x){return x.id!==id});saSave();saAudit("حذف حدث تقويم",c.title);saCalendar();saNotify("تم حذف الحدث")}

function saThemes(){
 var rows=SA.themes.map(function(t){return'<tr><td>'+saEsc(t.name)+'</td><td>'+saEsc(t.from||"—")+'</td><td>'+saEsc(t.to||"—")+'</td><td>'+ (t.active?"مفعل":"موقوف")+'</td></tr>'}).join("");
 saPage("الثيمات والمناسبات","إنشاء وجدولة الهوية البصرية للمناسبات",saTable(["الثيم","من","إلى","الحالة"],rows),'<button class="saProBtn" onclick="saAddTheme()">＋ ثيم</button>');
}
window.saAddTheme=function(){saOpen("إنشاء ثيم مناسبة",saField("اسم المناسبة *","tf1")+saField("البداية","tf2","datetime-local")+saField("النهاية","tf3","datetime-local"),"saSaveTheme()")}
window.saSaveTheme=function(){var n=document.getElementById("tf1").value.trim();if(!n)return saNotify("اسم المناسبة مطلوب");SA.themes.push({id:saId("T"),name:n,from:document.getElementById("tf2").value,to:document.getElementById("tf3").value,active:true});saSave();saAudit("إنشاء ثيم",n);saClose();saThemes();saNotify("تم حفظ الثيم")}

function saSupport(){
 var rows=SA.tickets.map(function(t){return'<tr><td>'+saEsc(t.serial)+'</td><td>'+saEsc(t.subject)+'</td><td>'+saEsc(t.type)+'</td><td>'+saEsc(t.status)+'</td><td>'+saEsc(t.file||"لا يوجد")+'</td><td><button class="saProBtn alt" onclick="saAdvanceTicket(\''+t.id+'\')">تحديث</button></td></tr>'}).join("");
 if(!rows)rows='<tr><td colspan="6"><div class="empty">لا توجد تذاكر دعم</div></td></tr>';
 saPage("الدعم الفني","التذاكر والمشكلات وطلبات الميزات",saTable(["الرقم","الموضوع","النوع","الحالة","المرفق",""],rows),'<button class="saProBtn" onclick="saAddTicket()">＋ تذكرة</button>');
}
window.saAddTicket=function(){saOpen("تذكرة دعم",saSelect("النوع","sfType",["مشكلة تقنية","طلب إضافة ميزة"])+saField("الموضوع *","sfSub")+ '<div class="saProField"><label>الوصف</label><textarea id="sfDesc" rows="4"></textarea></div><div class="saProField"><label>إرفاق صورة أو ملف</label><input id="sfFile" type="file"></div>',"saSaveTicket()")}
window.saSaveTicket=function(){var s=document.getElementById("sfSub").value.trim(),f=document.getElementById("sfFile").files[0];if(!s)return saNotify("الموضوع مطلوب");var serial="SUP-"+Date.now().toString().slice(-8);SA.tickets.push({id:saId("X"),serial:serial,type:document.getElementById("sfType").value,subject:s,description:document.getElementById("sfDesc").value,status:"جديدة",file:f?f.name:""});saSave();saAudit("إنشاء تذكرة دعم",serial);saClose();saSupport();saNotify("تم إرسال التذكرة")}
window.saAdvanceTicket=function(id){var t=SA.tickets.find(function(x){return x.id===id}),st=["جديدة","قيد المراجعة","قيد التنفيذ","تم الحل","مغلقة"],i=st.indexOf(t.status);t.status=st[(i+1)%st.length];saSave();saAudit("تحديث تذكرة",t.serial+" — "+t.status);saSupport();saNotify("تم تحديث الحالة")}

function saAuditPage(){
 var rows=SA.audit.map(function(a){return'<tr><td>'+saEsc(a.action)+'</td><td>'+saEsc(a.subject)+'</td><td>'+saEsc(a.time)+'</td></tr>'}).join("");
 if(!rows)rows='<tr><td colspan="3"><div class="empty">لا توجد عمليات</div></td></tr>';
 saPage("سجل التدقيق","العمليات المنفذة داخل حساب مدير المنظومة",saTable(["العملية","العنصر","التاريخ"],rows));
}
function saBackups(){
 saPage("النسخ الاحتياطي","أدوات نموذجية قبل ربط التخزين السحابي",'<div class="saProGrid"><div class="saPro6"><div class="saProCard"><h3>تصدير البيانات</h3><p>حفظ نسخة JSON من بيانات النموذج.</p><button class="saProBtn" onclick="saExport()">تصدير</button></div></div><div class="saPro6"><div class="saProCard"><h3>استيراد البيانات</h3><p>اختر ملف JSON لاستعادة نموذج محلي.</p><input id="saImportFile" type="file" accept=".json" onchange="saImport(this)"></div></div></div>');
}
window.saExport=function(){var b=new Blob([JSON.stringify(SA,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="system-admin-backup.json";a.click();URL.revokeObjectURL(a.href);saAudit("تصدير نسخة احتياطية","JSON");saNotify("تم تصدير النسخة")}
window.saImport=function(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.schools||!x.users)throw Error();SA=x;saSave();saAudit("استيراد نسخة احتياطية","JSON");saBackups();saNotify("تم الاستيراد")}catch(e){saNotify("ملف النسخة غير صالح")}};r.readAsText(f)}

window.saStart=function(){
 saLoad();
 var box=document.createElement("div");box.id="saProOverlay";box.className="saProOverlay";
 box.innerHTML='<div class="saProModal"><div class="saProHead"><h3 id="saProTitle"></h3><button class="saProClose" onclick="saClose()">✕</button></div><div class="saProBody" id="saProBody"></div><div class="saProFoot" id="saProFoot"></div></div>';
 document.body.appendChild(box);
 saHome();
};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",saStart);else saStart();
})();
</script>

</body></html>
